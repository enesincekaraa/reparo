name: reparo

services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: reparo
      POSTGRES_USER: reparo
      POSTGRES_PASSWORD: reparo_local_password

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reparo -d reparo"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: